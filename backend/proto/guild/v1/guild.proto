syntax = "proto3";

package guild.v1;

option go_package = "rokko.dev/gen/guild/v1;guildv1";

service GuildService {
  rpc CreateGuild(CreateGuildRequest) returns (Guild);
  rpc UpdateGuild(UpdateGuildRequest) returns (Guild);
  rpc DeleteGuild(GuildRef) returns (Empty);
  rpc GetGuild(GuildRef) returns (Guild);
  rpc ListMyGuilds(Empty) returns (ListGuildsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (Channel);
  rpc UpdateChannel(UpdateChannelRequest) returns (Channel);
  rpc DeleteChannel(ChannelRef) returns (Empty);
  rpc ListChannels(GuildRef) returns (ListChannelsResponse);
  rpc ReorderChannels(ReorderChannelsRequest) returns (ListChannelsResponse);
  rpc CreateInvite(CreateInviteRequest) returns (Invite);
  rpc JoinByInvite(JoinByInviteRequest) returns (Guild);
  rpc ListInvites(GuildRef) returns (ListInvitesResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (Empty);
  rpc LeaveGuild(GuildRef) returns (Empty);
  rpc KickMember(KickMemberRequest) returns (Empty);
  rpc SetMemberRole(SetMemberRoleRequest) returns (Member);
  rpc ListMembers(GuildRef) returns (ListMembersResponse);
  rpc CheckChannelAccess(CheckChannelAccessRequest) returns (CheckChannelAccessResponse);
}

message Empty {}

message GuildRef {
  string guild_id = 1;
}

message ChannelRef {
  string channel_id = 1;
}

message CreateGuildRequest {
  string name = 1;
  string icon_url = 2;
}

message UpdateGuildRequest {
  string guild_id = 1;
  string name = 2;
  string icon_url = 3;
}

message Guild {
  string id = 1;
  string name = 2;
  string icon_url = 3;
  string owner_id = 4;
  string my_role = 5;
}

message ListGuildsResponse {
  repeated Guild guilds = 1;
}

message CreateChannelRequest {
  string guild_id = 1;
  string name = 2;
  string type = 3;
}

message UpdateChannelRequest {
  string channel_id = 1;
  string name = 2;
}

message Channel {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  string type = 4;
  int32 position = 5;
}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message ReorderChannelsRequest {
  string guild_id = 1;
  repeated string channel_ids = 2;
}

message CreateInviteRequest {
  string guild_id = 1;
  int32 max_uses = 2;
  int64 expires_in_seconds = 3;
}

message JoinByInviteRequest {
  string code = 1;
}

message Invite {
  string code = 1;
  string guild_id = 2;
  string creator_id = 3;
  int32 max_uses = 4;
  int32 uses = 5;
  int64 expires_at_unix = 6;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message RevokeInviteRequest {
  string code = 1;
}

message KickMemberRequest {
  string guild_id = 1;
  string user_id = 2;
}

message SetMemberRoleRequest {
  string guild_id = 1;
  string user_id = 2;
  string role = 3;
}

message Member {
  string user_id = 1;
  string role = 2;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message CheckChannelAccessRequest {
  string channel_id = 1;
}

message CheckChannelAccessResponse {
  bool allowed = 1;
  string guild_id = 2;
  string role = 3;
  bool can_moderate = 4;
  string channel_type = 5;
}
