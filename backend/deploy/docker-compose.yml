services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rokko
      POSTGRES_PASSWORD: rokko
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rokko"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
  minio:
    build:
      context: ./minio
    environment:
      MINIO_ROOT_USER: rokko
      MINIO_ROOT_PASSWORD: rokko-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  coturn:
    image: coturn/coturn:4.6.2
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
  auth:
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: auth } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
  user:
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: user } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
  guild:
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: guild } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
  message:
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: message } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      guild: { condition: service_started }
      user: { condition: service_started }
  media:
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: media } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
  realtime:
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: realtime } }
    restart: unless-stopped
    ports: ["8081:8081"]
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      user: { condition: service_started }
  voice-1:
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: voice } }
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "10000:10000/udp"
    volumes:
      - ./voice/node1.yaml:/config.yaml:ro
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      guild: { condition: service_started }
      message: { condition: service_started }
      coturn: { condition: service_started }
  voice-2:
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: voice } }
    restart: unless-stopped
    ports:
      - "8083:8082"
      - "10001:10001/udp"
    volumes:
      - ./voice/node2.yaml:/config.yaml:ro
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      guild: { condition: service_started }
      message: { condition: service_started }
      coturn: { condition: service_started }
  envoy:
    image: envoyproxy/envoy:v1.33-latest
    restart: unless-stopped
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports: ["8080:8080"]
    depends_on: [auth, user, guild, message, media]
